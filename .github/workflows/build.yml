name: build
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - name: Build the public form shell needed by the API image
        run: pnpm install --frozen-lockfile && pnpm --filter @arha/forms build
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with: { context: ., file: infra/docker/api.Dockerfile, push: true, tags: "ghcr.io/${{ env.OWNER }}/arha-api:${{ github.sha }}" }
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: infra/docker/static.Dockerfile
          push: true
          tags: "ghcr.io/${{ env.OWNER }}/arha-static:${{ github.sha }}"
          build-args: |
            ARHA_APP_URL=${{ vars.ARHA_APP_URL }}
            ARHA_API_URL=${{ vars.ARHA_API_URL }}
            ARHA_SITE_URL=${{ vars.ARHA_SITE_URL }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with: { image-ref: "ghcr.io/${{ env.OWNER }}/arha-api:${{ github.sha }}", severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: true }
