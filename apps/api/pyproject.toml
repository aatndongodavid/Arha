[project]
name = "arha-api"
version = "0.1.0"
description = "Arha API: forms, Mobile Money payments and analytics"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "authlib>=1.9.5",
    "babel>=2.18.0",
    "email-validator>=2.3.0",
    "fastapi>=0.162.5",
    "gunicorn>=27.0.1",
    "httpx>=0.28.1",
    "nh3>=0.3.7",
    "phonenumbers>=9.0.43",
    "polars>=2.1.0",
    "procrastinate>=3.11.0",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pynacl>=1.6.2",
    "pyotp>=2.10.0",
    "pyreadstat>=1.3.7",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "segno>=1.6.6",
    "sqlalchemy[asyncio]>=2.1.8",
    "structlog>=26.1.0",
    "uuid-utils>=1.2.0",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=70.0",
    "xlsxwriter>=3.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arha"]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.95.0",
    "hypothesis>=6.170.15",
    "import-linter>=2.16",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]
