name: build
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with: { node-version: 22, cache: pnpm }
      - name: Build the public form shell needed by the API image
        run: pnpm install --frozen-lockfile && pnpm --filter @arha/forms build
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with: { context: ., file: infra/docker/api.Dockerfile, push: true, tags: "ghcr.io/${{ env.OWNER }}/arha-api:${{ github.sha }}" }
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: infra/docker/static.Dockerfile
          push: true
          tags: "ghcr.io/${{ env.OWNER }}/arha-static:${{ github.sha }}"
          build-args: |
            ARHA_APP_URL=${{ vars.ARHA_APP_URL }}
            ARHA_API_URL=${{ vars.ARHA_API_URL }}
            ARHA_SITE_URL=${{ vars.ARHA_SITE_URL }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with: { image-ref: "ghcr.io/${{ env.OWNER }}/arha-api:${{ github.sha }}", severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: true }
